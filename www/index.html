<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Diario de Fe</title>
<style>
  :root {
    --bg-app: #12100e;
    --bg-paper: #1a1714;
    --lines: #26221e;
    --ink: #d4c5b0;
    --ink-faint: #7a7061;
    --accent: #a68453;
    --accent-hover: #c49d66;
    --danger: #8a3a33;
    --shadow: 0 4px 15px rgba(0,0,0,0.5);
  }

  * { box-sizing: border-box; }
  
  html, body {
    margin: 0; padding: 0; height: 100%;
  }

  body {
    background: var(--bg-app);
    color: var(--ink);
    font-family: "Georgia", serif;
    padding-bottom: 90px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 500px;
    margin: 0 auto;
    padding: 0 12px;
  }

  .notebook-page {
    background-color: var(--bg-paper);
    background-image: repeating-linear-gradient(transparent, transparent 31px, var(--lines) 31px, var(--lines) 32px);
    border-radius: 4px;
    box-shadow: var(--shadow);
    padding: 32px 20px 20px;
    margin-top: 20px;
    position: relative;
  }

  .notebook-page::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: 40px;
    width: 1px;
    background: rgba(166, 132, 83, 0.3);
    z-index: 1;
  }

  .notebook-content {
    position: relative;
    z-index: 2;
    padding-left: 30px;
  }

  input[type="text"], input[type="date"], textarea {
    background: transparent;
    border: none;
    color: var(--ink);
    font-family: "Georgia", serif;
    font-size: 18px;
    width: 100%;
    outline: none;
  }
  
  input::placeholder, textarea::placeholder {
    color: var(--ink-faint);
    font-style: italic;
  }

  .title-input {
    font-size: 22px !important;
    font-weight: bold;
    margin-bottom: 5px;
    border-bottom: 1px solid var(--lines) !important;
    padding-bottom: 5px;
  }

  .date-input {
    font-size: 14px !important;
    color: var(--ink-faint) !important;
    margin-bottom: 15px;
  }

  textarea.journal-body {
    line-height: 32px;
    min-height: 300px;
    resize: none;
    overflow: hidden;
  }

  .detected-verses {
    margin-top: 15px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .verse-chip {
    background: var(--bg-app);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-family: sans-serif;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .verse-chip:hover {
    background: var(--accent);
    color: var(--bg-app);
  }

  .btn {
    background: var(--accent);
    color: var(--bg-app);
    border: none;
    padding: 12px 20px;
    border-radius: 4px;
    font-family: sans-serif;
    font-weight: bold;
    font-size: 14px;
    cursor: pointer;
    width: 100%;
    margin-top: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  nav.tabs {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--bg-app);
    display: flex;
    border-top: 1px solid var(--lines);
    z-index: 10;
  }

  nav.tabs button {
    flex: 1;
    background: none;
    border: none;
    padding: 15px;
    color: var(--ink-faint);
    font-size: 14px;
    font-family: sans-serif;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.3s;
  }

  nav.tabs button.active {
    color: var(--accent);
    border-top: 2px solid var(--accent);
  }

  .view { display: none; }
  .view.active { display: block; }

  .saved-entry {
    border-bottom: 1px solid var(--lines);
    padding: 20px 0;
  }
  
  .saved-date { font-size: 12px; color: var(--accent); font-family: sans-serif; text-transform: uppercase; }
  .saved-title { font-size: 20px; font-weight: bold; margin: 5px 0 10px; }
  .saved-body { font-size: 16px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: var(--accent); color: var(--bg-app);
    padding: 10px 20px; border-radius: 30px; font-family: sans-serif;
    font-size: 14px; font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="app">
  <div class="view active" id="view-diario">
    <div class="notebook-page">
      <div class="notebook-content">
        <input type="text" id="entry-title" class="title-input" placeholder="Título de tu entrada...">
        <input type="date" id="entry-date" class="date-input">
        
        <textarea id="entry-content" class="journal-body" placeholder="Escribe lo que Dios te habló hoy..." oninput="autoResize(this); detectVerses(this.value)"></textarea>
        
        <div id="detected-verses-container" class="detected-verses"></div>
      </div>
    </div>
    <button class="btn" onclick="saveEntry()">Guardar en mi diario</button>

    <div style="margin-top: 40px;" id="entries-list"></div>
  </div>

  <div class="view" id="view-versiculos">
    <div class="notebook-page">
      <div class="notebook-content">
        <h3 style="margin-top:0; color: var(--accent);">Versículos Guardados</h3>
        <p style="font-family: sans-serif; font-size: 13px; color: var(--ink-faint);">Los versículos detectados en tus entradas de diario aparecerán aquí automáticamente para tu meditación.</p>
        <div id="verses-list"></div>
      </div>
    </div>
  </div>
</div>

<nav class="tabs">
  <button class="active" id="tab-diario" onclick="switchTab('diario')">Diario</button>
  <button id="tab-versiculos" onclick="switchTab('versiculos')">Versículos</button>
</nav>

<script>
let journal = [];
let savedVerses = new Set();
const verseRegex = /(?:[1-3]\s+)?[A-ZÁÉÍÓÚÑa-záéíóúñ]+\s+\d+:\d+(?:-\d+)?/g;

function todayISO() {
  return new Date().toISOString().slice(0,10);
}

document.getElementById('entry-date').value = todayISO();

function switchTab(name) {
  document.getElementById('view-diario').classList.toggle('active', name === 'diario');
  document.getElementById('view-versiculos').classList.toggle('active', name === 'versiculos');
  document.getElementById('tab-diario').classList.toggle('active', name === 'diario');
  document.getElementById('tab-versiculos').classList.toggle('active', name === 'versiculos');
  if(name === 'versiculos') renderVerses();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function autoResize(textarea) {
  textarea.style.height = 'auto';
  textarea.style.height = (textarea.scrollHeight) + 'px';
}

function detectVerses(text) {
  const container = document.getElementById('detected-verses-container');
  container.innerHTML = '';
  const matches = [...new Set(text.match(verseRegex))];
  
  matches.forEach(verse => {
    const chip = document.createElement('div');
    chip.className = 'verse-chip';
    chip.innerHTML = `<span>📖 ${verse}</span> <span style="font-size:10px;">(Guardar)</span>`;
    chip.onclick = () => saveVerseDirectly(verse);
    container.appendChild(chip);
  });
}

function saveVerseDirectly(verse) {
  if(!savedVerses.has(verse)) {
    savedVerses.add(verse);
    showToast(`"${verse}" guardado en tu colección.`);
  } else {
    showToast('Este versículo ya está guardado.');
  }
}

function saveEntry() {
  const title = document.getElementById('entry-title').value.trim();
  const date = document.getElementById('entry-date').value;
  const content = document.getElementById('entry-content').value.trim();

  if(!content) {
    showToast('La hoja está en blanco.');
    return;
  }

  const matches = content.match(verseRegex);
  if(matches) {
    matches.forEach(verse => savedVerses.add(verse));
  }

  journal.unshift({
    id: Date.now().toString(),
    title: title || 'Sin título',
    date,
    content
  });

  document.getElementById('entry-title').value = '';
  document.getElementById('entry-content').value = '';
  document.getElementById('entry-date').value = todayISO();
  document.getElementById('entry-content').style.height = '300px';
  document.getElementById('detected-verses-container').innerHTML = '';

  showToast('Entrada guardada.');
  renderEntries();
}

function renderEntries() {
  const list = document.getElementById('entries-list');
  if(journal.length === 0) {
    list.innerHTML = '';
    return;
  }

  list.innerHTML = journal.map(e => `
    <div class="saved-entry">
      <div class="saved-date">${e.date}</div>
      <div class="saved-title">${e.title}</div>
      <div class="saved-body">${e.content}</div>
    </div>
  `).join('');
}

function renderVerses() {
  const list = document.getElementById('verses-list');
  if(savedVerses.size === 0) {
    list.innerHTML = '<p style="color:var(--ink-faint); font-style:italic;">Aún no se han detectado versículos.</p>';
    return;
  }

  list.innerHTML = Array.from(savedVerses).map(v => `
    <div style="padding: 15px 0; border-bottom: 1px solid var(--lines);">
      <strong style="color:var(--accent); font-size: 18px;">${v}</strong>
    </div>
  `).join('');
}
</script>
</body>
</html>
