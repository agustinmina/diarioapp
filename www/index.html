<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Diario de Fe</title>
<style>
  /* TEMAS */
  :root[data-theme="dark"] {
    --bg-app: #12100e; --bg-paper: #1a1714; --lines: #363028;
    --ink: #f5f0e6; --ink-faint: #b3a895; --accent: #c9a46b;
    --accent-hover: #e0bc82; --danger: #d95e53; --shadow: 0 4px 15px rgba(0,0,0,0.6);
    --input-bg: #231f1a;
  }
  :root[data-theme="light"] {
    --bg-app: #f4f1eb; --bg-paper: #ffffff; --lines: #e6dfd3;
    --ink: #2b2621; --ink-faint: #7a7369; --accent: #8c6a38;
    --accent-hover: #6e5229; --danger: #9c362d; --shadow: 0 2px 10px rgba(0,0,0,0.08);
    --input-bg: #f9f8f6;
  }

  * { box-sizing: border-box; }
  
  html, body { margin: 0; padding: 0; min-height: 100vh; transition: background 0.3s; }
  
  body {
    background: var(--bg-app); color: var(--ink); font-family: "Georgia", serif;
    padding-bottom: 90px; -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 500px; margin: 0 auto; padding: 0 12px; }

  /* HOJA ESTILO LIBRETA (Fondo liso y limpio, sin rayas horizontales) */
  .notebook-page {
    background-color: var(--bg-paper);
    border-radius: 8px; box-shadow: var(--shadow); padding: 32px 20px 20px;
    margin-top: 20px; position: relative; transition: background-color 0.3s, box-shadow 0.3s;
  }
  .notebook-page::before {
    content: ''; position: absolute; top: 0; bottom: 0; left: 40px;
    width: 1px; background: rgba(166, 132, 83, 0.4); z-index: 1;
  }
  .notebook-content { position: relative; z-index: 2; padding-left: 30px; }

  /* INPUTS */
  input[type="text"], input[type="date"], textarea, select {
    background: transparent; border: none; color: var(--ink);
    font-family: "Georgia", serif; font-size: 18px; width: 100%; outline: none;
  }
  input::placeholder, textarea::placeholder { color: var(--ink-faint); font-style: italic; opacity: 0.8; }
  
  .title-input { font-size: 22px !important; font-weight: bold; margin-bottom: 5px; border-bottom: 1px solid var(--lines) !important; padding-bottom: 5px; }
  .date-input { font-size: 14px !important; color: var(--ink-faint) !important; margin-bottom: 15px; }
  textarea.journal-body { line-height: 32px; min-height: 300px; resize: none; overflow: hidden; }

  /* CONTROLES BÍBLICOS */
  .bible-controls {
    display: flex; gap: 10px; margin-bottom: 12px; background: var(--bg-app);
    padding: 10px; border-radius: 8px; border: 1px solid var(--lines);
  }
  .bible-controls select {
    background: var(--input-bg); padding: 8px; border-radius: 4px; font-size: 15px;
    border: 1px solid var(--lines); cursor: pointer;
  }
  
  /* Barra de búsqueda rápida de libros */
  .book-search-input {
    background: var(--input-bg); border: 1px solid var(--lines); color: var(--ink);
    padding: 6px 10px; border-radius: 6px; font-family: sans-serif; font-size: 13px;
    margin-bottom: 8px; width: 100%; outline: none;
  }

  .toggle-group { display: flex; margin-bottom: 15px; border: 1px solid var(--accent); border-radius: 6px; overflow: hidden; }
  .toggle-group button {
    flex: 1; padding: 10px; background: transparent; border: none; color: var(--ink);
    font-family: sans-serif; font-size: 13px; font-weight: bold; cursor: pointer;
  }
  .toggle-group button.active { background: var(--accent); color: #fff; }

  /* BOTONES Y CONTROLES DE ZOOM */
  .zoom-controls {
    display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 10px;
  }
  .zoom-btn {
    background: var(--input-bg); border: 1px solid var(--lines); color: var(--accent);
    padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer;
  }

  .detected-verses { margin-top: 15px; display: flex; flex-wrap: wrap; gap: 10px; }
  .verse-chip {
    background: var(--bg-app); border: 1px solid var(--accent); color: var(--accent);
    padding: 6px 12px; border-radius: 20px; font-size: 13px; font-family: sans-serif;
    display: flex; align-items: center; gap: 8px; cursor: pointer; transition: all 0.2s;
  }
  .btn {
    background: var(--accent); color: #fff; border: none; padding: 12px 20px;
    border-radius: 6px; font-family: sans-serif; font-weight: bold; font-size: 14px;
    cursor: pointer; width: 100%; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px;
  }
  .search-box {
    background: var(--input-bg); border: 1px solid var(--lines); color: var(--ink);
    padding: 12px 15px; border-radius: 8px; font-family: sans-serif; font-size: 15px;
    margin-bottom: 15px; width: 100%; outline: none;
  }

  /* LISTAS Y RESULTADOS */
  .bible-result-card, .bible-verse-line { border-bottom: 1px solid var(--lines); padding: 14px 0; }
  .bible-verse-line { line-height: 1.65; font-size: var(--bible-font-size, 17px); }
  .bible-ref { color: var(--accent); font-weight: bold; font-size: 16px; margin-bottom: 5px; }
  .verse-num { color: var(--accent); font-weight: bold; font-size: 12px; margin-right: 6px; vertical-align: super; }
  
  .verse-note { display: block; font-size: 12.5px; color: var(--ink-faint); margin-top: 4px; font-style: italic; }
  
  .verse-actions-bar {
    float: right; display: flex; gap: 5px; margin-top: 2px;
  }
  .action-btn {
    background: none; border: 1px solid var(--accent); color: var(--accent);
    font-size: 11px; font-family: sans-serif; padding: 3px 8px; border-radius: 12px;
    cursor: pointer; transition: 0.2s;
  }
  .action-btn:hover { background: var(--accent); color: #fff; }

  /* Botón siguiente capítulo */
  .next-chapter-btn {
    background: transparent; border: 1px dashed var(--accent); color: var(--accent);
    width: 100%; padding: 12px; border-radius: 8px; font-family: sans-serif;
    font-weight: bold; font-size: 13px; cursor: pointer; margin-top: 25px; text-transform: uppercase;
  }
  .next-chapter-btn:hover { background: var(--accent-soft, rgba(201, 164, 107, 0.1)); }

  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-app);
    display: flex; border-top: 1px solid var(--lines); z-index: 10;
    transition: transform 0.3s ease;
  }
  /* Ocultar barra al escribir */
  nav.tabs.hidden-nav { transform: translateY(100%); }

  nav.tabs button {
    flex: 1; background: none; border: none; padding: 15px 5px; color: var(--ink-faint);
    font-size: 12px; font-family: sans-serif; text-transform: uppercase; letter-spacing: 1px; cursor: pointer;
  }
  nav.tabs button.active { color: var(--accent); border-top: 2px solid var(--accent); font-weight: bold; }
  .view { display: none; }
  .view.active { display: block; }
  
  .saved-entry { border-bottom: 1px solid var(--lines); padding: 20px 0; }
  .saved-date { font-size: 12px; color: var(--accent); font-family: sans-serif; text-transform: uppercase; }
  .saved-title { font-size: 20px; font-weight: bold; margin: 5px 0 10px; }
  .saved-body { font-size: 16px; line-height: 1.6; color: var(--ink); white-space: pre-wrap; }

  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--accent);
    color: #fff; padding: 10px 20px; border-radius: 30px; font-family: sans-serif; font-size: 14px;
    font-weight: bold; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="app">
  <!-- VISTA: DIARIO -->
  <div class="view active" id="view-diario">
    <div class="notebook-page">
      <div class="notebook-content">
        <input type="text" id="entry-title" class="title-input" placeholder="Título de tu entrada...">
        <input type="date" id="entry-date" class="date-input">
        <textarea id="entry-content" class="journal-body" placeholder="Escribe lo que Dios te habló hoy..." oninput="autoResize(this); detectVerses(this.value); handleFocusInput()"></textarea>
        <div id="detected-verses-container" class="detected-verses"></div>
      </div>
    </div>
    <button class="btn" onclick="saveEntry()">Guardar en mi diario</button>
    <div style="margin-top: 40px;" id="entries-list"></div>
  </div>

  <!-- VISTA: GUARDADOS -->
  <div class="view" id="view-versiculos">
    <div class="notebook-page">
      <div class="notebook-content">
        <h3 style="margin-top:0; color: var(--accent);">Colección de Versículos</h3>
        <div id="verses-list"></div>
      </div>
    </div>
  </div>

  <!-- VISTA: BIBLIA INTEGRADA -->
  <div class="view" id="view-biblia">
    <div class="notebook-page" style="padding-top: 20px;">
      <div class="notebook-content" style="padding-left: 10px;">
        
        <select id="bible-version-select" class="search-box" onchange="loadBibleVersion(this.value)">
          <option value="RVR1960_vid_149.json">Reina Valera 1960 (RVR1960)</option>
          <option value="NVI_vid_128.json">Nueva Versión Internacional (NVI)</option>
          <option value="NTV_vid_127.json">Nueva Traducción Viviente (NTV)</option>
          <option value="TLA_vid_176.json">Traducción en Lenguaje Actual (TLA)</option>
          <option value="LBLA_vid_89.json">La Biblia de las Américas (LBLA)</option>
          <option value="NBLA_vid_103.json">Nueva Biblia de las Américas (NBLA)</option>
          <option value="DHH94I_vid_52.json">Dios Habla Hoy (DHH)</option>
        </select>

        <div class="toggle-group">
          <button id="mode-read" class="active" onclick="setBibleMode('read')">LEER</button>
          <button id="mode-search" onclick="setBibleMode('search')">BUSCAR</button>
        </div>

        <!-- CONTROLES DE ZOOM (A+ / A-) -->
        <div class="zoom-controls">
          <button class="zoom-btn" onclick="changeFontSize(-1)">A-</button>
          <button class="zoom-btn" onclick="changeFontSize(1)">A+</button>
        </div>

        <div id="bible-read-container">
          <!-- Buscador rápido de libros -->
          <input type="text" id="book-quick-search" class="book-search-input" placeholder="🔍 Filtrar libro..." oninput="filterBooks(this.value)">
          
          <div class="bible-controls">
            <select id="bible-book-select" onchange="onBookChange()" style="flex: 2;"></select>
            <select id="bible-chapter-select" onchange="onChapterChange()" style="flex: 1;"></select>
          </div>
          <div id="bible-chapter-text" style="margin-top: 15px;"></div>
          <button id="next-chap-btn" class="next-chapter-btn" onclick="nextChapter()">Siguiente Capítulo ➔</button>
        </div>

        <div id="bible-search-container" style="display: none;">
          <input type="text" id="bible-search-input" class="search-box" placeholder="Ej: 'amor' o 'Juan 3:16'" oninput="searchBible()">
          <div id="bible-results-container"></div>
        </div>

      </div>
    </div>
  </div>
</div>

<nav class="tabs" id="main-nav">
  <button class="active" id="tab-diario" onclick="switchTab('diario')">Diario</button>
  <button id="tab-versiculos" onclick="switchTab('versiculos')">Guardados</button>
  <button id="tab-biblia" onclick="switchTab('biblia')">Biblia</button>
  <button id="tab-theme" onclick="toggleTheme()">☀️/🌙</button>
</nav>

<script>
// --- TEMA ---
function toggleTheme() {
  const html = document.documentElement;
  const newTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', newTheme);
  localStorage.setItem('diario_theme', newTheme);
}
document.documentElement.setAttribute('data-theme', localStorage.getItem('diario_theme') || 'dark');

// --- TABS GLOBALES ---
function switchTab(name) {
  ['diario', 'versiculos', 'biblia'].forEach(tab => {
    document.getElementById(`view-${tab}`).classList.toggle('active', name === tab);
    document.getElementById(`tab-${tab}`).classList.toggle('active', name === tab);
  });
  if(name === 'versiculos') renderVerses();
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

// --- PANTALLA COMPLETA AL ESCRIBIR EN EL DIARIO ---
const textareaEl = document.getElementById('entry-content');
const navBar = document.getElementById('main-nav');

textareaEl.addEventListener('focus', () => {
  navBar.classList.add('hidden-nav');
});
textareaEl.addEventListener('blur', () => {
  navBar.classList.remove('hidden-nav');
});

function handleFocusInput() {
  navBar.classList.add('hidden-nav');
}

// --- AJUSTE DE TAMAÑO DE LETRA (ZOOM) ---
let currentFontSize = parseInt(localStorage.getItem('bible_font_size') || '17');
document.documentElement.style.setProperty('--bible-font-size', currentFontSize + 'px');

function changeFontSize(delta) {
  currentFontSize += delta * 2;
  if(currentFontSize < 13) currentFontSize = 13;
  if(currentFontSize > 26) currentFontSize = 26;
  document.documentElement.style.setProperty('--bible-font-size', currentFontSize + 'px');
  localStorage.setItem('bible_font_size', currentFontSize);
}

// --- LÓGICA DIARIO ---
let journal = [];
let savedVerses = new Set();
const verseRegex = /(?:[1-3]\s+)?[A-ZÁÉÍÓÚÑa-záéíóúñ]+\s+\d+:\d+(?:-\d+)?/g;
document.getElementById('entry-date').value = new Date().toISOString().slice(0,10);

function autoResize(textarea) {
  textarea.style.height = 'auto'; textarea.style.height = textarea.scrollHeight + 'px';
}
function detectVerses(text) {
  const container = document.getElementById('detected-verses-container');
  container.innerHTML = '';
  [...new Set(text.match(verseRegex))].forEach(verse => {
    const chip = document.createElement('div');
    chip.className = 'verse-chip';
    chip.innerHTML = `<span>📖 ${verse}</span> <span style="font-size:10px;">(Guardar)</span>`;
    chip.onclick = () => { savedVerses.add(verse); showToast("Guardado."); }
    container.appendChild(chip);
  });
}
function saveEntry() {
  const title = document.getElementById('entry-title').value.trim();
  const date = document.getElementById('entry-date').value;
  const content = document.getElementById('entry-content').value.trim();
  if(!content) return showToast('La hoja está vacía.');
  
  const matches = content.match(verseRegex);
  if(matches) matches.forEach(v => savedVerses.add(v));

  journal.unshift({ id: Date.now().toString(), title: title || 'Sin título', date, content });
  
  document.getElementById('entry-title').value = '';
  document.getElementById('entry-content').value = '';
  document.getElementById('detected-verses-container').innerHTML = '';
  showToast('Entrada guardada.');
  renderEntries();
}
function renderEntries() {
  document.getElementById('entries-list').innerHTML = journal.map(e => `
    <div class="saved-entry"><div class="saved-date">${e.date}</div><div class="saved-title">${e.title}</div><div class="saved-body">${e.content}</div></div>
  `).join('');
}
function renderVerses() {
  const list = document.getElementById('verses-list');
  if(savedVerses.size === 0) return list.innerHTML = '<p style="color:var(--ink-faint);">Sin versículos favoritos aún.</p>';
  list.innerHTML = Array.from(savedVerses).map(v => `<div style="padding: 15px 0; border-bottom: 1px solid var(--lines);"><strong style="color:var(--accent); font-size: 18px;">${v}</strong></div>`).join('');
}

function markFavorite(refText) {
  if(!savedVerses.has(refText)) {
    savedVerses.add(refText);
    showToast(`"${refText}" agregado a favoritos.`);
  } else {
    showToast('Este versículo ya está en tu colección.');
  }
}

function shareVerse(ref, text) {
  const shareMsg = `“${text}” - ${ref}`;
  if(navigator.clipboard) {
    navigator.clipboard.writeText(shareMsg).then(() => {
      showToast('Versículo copiado al portapapeles.');
    });
  }
}

// --- LÓGICA BIBLIA ---
let bibleData = [];
let allBooksList = [];
let currentVersion = "RVR1960_vid_149.json";
let currentBook = "Génesis";
let currentChapter = 1;

function setBibleMode(mode) {
  document.getElementById('mode-read').classList.toggle('active', mode === 'read');
  document.getElementById('mode-search').classList.toggle('active', mode === 'search');
  document.getElementById('bible-read-container').style.display = mode === 'read' ? 'block' : 'none';
  document.getElementById('bible-search-container').style.display = mode === 'search' ? 'block' : 'none';
}

function loadBibleVersion(filename, saveHistory = true) {
  currentVersion = filename;
  if(saveHistory) saveLastPosition();

  showToast("Procesando base de datos...");
  document.getElementById('bible-book-select').innerHTML = '';
  document.getElementById('bible-chapter-select').innerHTML = '';
  document.getElementById('bible-chapter-text').innerHTML = '<p style="color:var(--ink-faint);">Cargando...</p>';

  fetch(filename)
    .then(res => res.json())
    .then(data => {
      let flatBible = [];
      
      if (data.books) {
        data.books.forEach(b => {
          b.chapters.forEach(c => {
            if (c.is_chapter === false) return;

            let chapNumMatch = c.current && c.current.human ? c.current.human.match(/\d+$/) : null;
            let chapNum = chapNumMatch ? parseInt(chapNumMatch[0]) : 1;

            if (c.chapter_html) {
              let temp = document.createElement('div');
              temp.innerHTML = c.chapter_html;
              
              let notesList = [];
              let notes = temp.querySelectorAll('.f, .x, .note, .footnote, .crossreference');
              notes.forEach(n => {
                notesList.push(n.textContent.trim());
                n.remove();
              });
              
              let supTags = temp.querySelectorAll('sup');
              supTags.forEach(s => s.remove());

              let html = temp.innerHTML;
              html = html.replace(/<[^>]+class="[^"]*\b(v|verse)\b[^"]*"[^>]*>(.*?)<\/[^>]+>/gi, '|||V:$2|||');
              
              temp.innerHTML = html;
              let plain = temp.textContent || temp.innerText || "";
              
              let parts = plain.split('|||V:');
              if (parts.length > 1) {
                for(let i = 1; i < parts.length; i++) {
                  let splitIdx = parts[i].indexOf('|||');
                  if(splitIdx !== -1) {
                    let vNum = parts[i].substring(0, splitIdx).trim();
                    let vText = parts[i].substring(splitIdx + 3).replace(/\s+/g, ' ').trim();
                    if(vText) {
                      let vNote = notesList.length > 0 ? notesList.shift() : "";
                      flatBible.push({ book: b.name, chapter: chapNum, verse: vNum, text: vText, note: vNote });
                    }
                  }
                }
              } else {
                let vText = plain.replace(/\s+/g, ' ').trim();
                if(vText) {
                  flatBible.push({ book: b.name, chapter: chapNum, verse: "1", text: vText, note: "" });
                }
              }
            }
          });
        });
      } else {
        flatBible = data;
      }

      bibleData = flatBible;
      allBooksList = [...new Set(bibleData.map(v => v.book))];
      populateBooks(allBooksList);
      showToast(`¡Versión lista!`);
    })
    .catch(() => {
      bibleData = [];
      document.getElementById('bible-chapter-text').innerHTML = `<p style="color:var(--danger); font-size:14px;">Falta el archivo <b>${filename}</b>.</p>`;
    });
}

function populateBooks(booksArray) {
  if(!bibleData.length) return;
  const bookSelect = document.getElementById('bible-book-select');
  bookSelect.innerHTML = booksArray.map(b => `<option value="${b}">${b}</option>`).join('');
  
  if(booksArray.includes(currentBook)) {
    bookSelect.value = currentBook;
  } else if(booksArray.length > 0) {
    currentBook = booksArray[0];
    bookSelect.value = currentBook;
  }
  populateChapters();
}

function filterBooks(query) {
  const q = query.toLowerCase().trim();
  const filtered = allBooksList.filter(b => b.toLowerCase().includes(q));
  populateBooks(filtered.length ? filtered : allBooksList);
}

function populateChapters() {
  if(!bibleData.length) return;
  const selectedBook = document.getElementById('bible-book-select').value;
  if(selectedBook) currentBook = selectedBook;
  
  const chapters = [...new Set(bibleData.filter(v => v.book === currentBook).map(v => v.chapter))];
  chapters.sort((a, b) => a - b);
  
  const chapterSelect = document.getElementById('bible-chapter-select');
  chapterSelect.innerHTML = chapters.map(c => `<option value="${c}">Cap. ${c}</option>`).join('');
  
  if(chapters.includes(currentChapter)) {
    chapterSelect.value = currentChapter;
  } else if(chapters.length > 0) {
    currentChapter = chapters[0];
    chapterSelect.value = currentChapter;
  }
  renderChapter();
}

function onBookChange() {
  currentBook = document.getElementById('bible-book-select').value;
  currentChapter = 1;
  populateChapters();
  saveLastPosition();
}

function onChapterChange() {
  currentChapter = parseInt(document.getElementById('bible-chapter-select').value);
  renderChapter();
  saveLastPosition();
}

function nextChapter() {
  const chapters = [...new Set(bibleData.filter(v => v.book === currentBook).map(v => v.chapter))];
  chapters.sort((a, b) => a - b);
  const currentIndex = chapters.indexOf(currentChapter);
  
  if(currentIndex !== -1 && currentIndex < chapters.length - 1) {
    currentChapter = chapters[currentIndex + 1];
    document.getElementById('bible-chapter-select').value = currentChapter;
    renderChapter();
    saveLastPosition();
    window.scrollTo({top: 0, behavior: 'smooth'});
  } else {
    // Si es el último capítulo, pasar al siguiente libro si existe
    const bookIndex = allBooksList.indexOf(currentBook);
    if(bookIndex !== -1 && bookIndex < allBooksList.length - 1) {
      currentBook = allBooksList[bookIndex + 1];
      document.getElementById('bible-book-select').value = currentBook;
      populateChapters();
      saveLastPosition();
      window.scrollTo({top: 0, behavior: 'smooth'});
    } else {
      showToast('Estás en el final de la Biblia.');
    }
  }
}

function renderChapter() {
  if(!bibleData.length) return;
  const textContainer = document.getElementById('bible-chapter-text');
  
  const verses = bibleData.filter(v => v.book === currentBook && v.chapter === currentChapter);
  textContainer.innerHTML = verses.map(v => {
    let fullRef = `${currentBook} ${currentChapter}:${v.verse}`;
    let escapedText = v.text.replace(/'/g, "\\'");
    return `
      <div class="bible-verse-line">
        <div class="verse-actions-bar">
          <button class="action-btn" onclick="shareVerse('${fullRef}', '${escapedText}')">📤 Compartir</button>
          <button class="action-btn" onclick="markFavorite('${fullRef}')">★ Favorito</button>
        </div>
        <span class="verse-num">${v.verse}</span> ${v.text}
        ${v.note ? `<span class="verse-note">Nota: ${v.note}</span>` : ''}
      </div>
    `;
  }).join('');
}

function searchBible() {
  const query = document.getElementById('bible-search-input').value.toLowerCase().trim();
  const container = document.getElementById('bible-results-container');
  if(bibleData.length === 0) return container.innerHTML = `<p style="color:var(--danger); font-size:14px;">Carga una biblia primero.</p>`;
  if(query.length < 3) return container.innerHTML = '<p style="color:var(--ink-faint);">Escribe para buscar...</p>';

  const results = bibleData.filter(v => 
    (v.book + " " + v.chapter + ":" + v.verse).toLowerCase().includes(query) || v.text.toLowerCase().includes(query)
  ).slice(0, 50);

  if(results.length === 0) return container.innerHTML = '<p style="color:var(--ink-faint);">Sin resultados.</p>';

  container.innerHTML = results.map(v => {
    let fullRef = `${v.book} ${v.chapter}:${v.verse}`;
    let escapedText = v.text.replace(/'/g, "\\'");
    return `
      <div class="bible-result-card">
        <div class="verse-actions-bar">
          <button class="action-btn" onclick="shareVerse('${fullRef}', '${escapedText}')">📤 Compartir</button>
          <button class="action-btn" onclick="markFavorite('${fullRef}')">★ Favorito</button>
        </div>
        <div class="bible-ref">${fullRef}</div>
        <div class="bible-text">${v.text}</div>
        ${v.note ? `<div class="verse-note">Nota: ${v.note}</div>` : ''}
      </div>
    `;
  }).join('');
}

// --- HISTORIAL DE LECTURA (Reciente) ---
function saveLastPosition() {
  const pos = { version: currentVersion, book: currentBook, chapter: currentChapter };
  localStorage.setItem('diario_last_bible', JSON.stringify(pos));
}

window.onload = () => {
  const savedPos = localStorage.getItem('diario_last_bible');
  if(savedPos) {
    try {
      const pos = JSON.parse(savedPos);
      currentVersion = pos.version || currentVersion;
      currentBook = pos.book || currentBook;
      currentChapter = pos.chapter || currentChapter;
      document.getElementById('bible-version-select').value = currentVersion;
    } catch(e) {}
  }
  loadBibleVersion(currentVersion, false);
};
</script>
